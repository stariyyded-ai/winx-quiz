/* ---------------- музыка (синтезатор в браузере) ---------------- */
const Music = {
  ctx: null, master: null, mode: null, step: 0, next: 0, timer: null,
  on: store.get("fq-sound") !== false,
  init(){
    try {
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC(); this.master = this.ctx.createGain();
        this.master.gain.value = this.on ? 0.22 : 0; this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch(e){}
  },
  toggle(){
    this.on = !this.on; store.set("fq-sound", this.on); this.init();
    if (this.master) this.master.gain.setTargetAtTime(this.on ? 0.22 : 0, this.ctx.currentTime, 0.05);
    const b = document.getElementById("snd"); if (b) b.textContent = this.on ? "🔊" : "🔇";
  },
  f: m => 440 * Math.pow(2, (m - 69) / 12),
  tone(m, t, dur, type = "sine", vol = 0.3){
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = this.f(m);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(t, dur, vol){
    const c = this.ctx; if (!c) return;
    if (!this.nb){ this.nb = c.createBuffer(1, c.sampleRate * 0.2, c.sampleRate); const d = this.nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = c.createBufferSource(), g = c.createGain(), hp = c.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 7000; s.buffer = this.nb;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(hp); hp.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.02);
  },
  patterns: {
    lobby: { bpm: 96, chords: [[60,64,67],[57,60,64],[53,57,60],[55,59,62]],
      play(M, st, t, c){ const tones = [c[0], c[1], c[2], c[0] + 12]; const ord = [0,1,2,3,2,1,2,3];
        M.tone(tones[ord[st % 8]] + 12, t, 0.5, "triangle", 0.16);
        if (st % 4 === 0) M.tone(c[0] - 12, t, 0.9, "sine", 0.28);
        if (st % 16 === 7) M.tone(c[2] + 24, t, 1.2, "sine", 0.07); } },
    question: { bpm: 150, chords: [[57,60,64],[53,57,60],[48,52,55],[55,59,62]],
      play(M, st, t, c){ const ord = [0,2,1,2,0,2,1,2]; const tones = [c[0], c[1], c[2]];
        M.tone(tones[ord[st % 8]] + 12, t, 0.18, "triangle", 0.15);
        if (st % 2 === 0) M.tone(c[0] - 12, t, 0.22, "sine", 0.3);
        if (st % 2 === 1) M.noise(t, 0.04, 0.05); } },
  },
  play(mode){
    this.init(); if (!this.ctx) return;
    if (mode === this.mode) return;
    this.mode = mode; this.step = 0; this.next = this.ctx.currentTime + 0.08;
    clearInterval(this.timer); if (!this.patterns[mode]) return;
    this.timer = setInterval(() => {
      const p = this.patterns[this.mode]; if (!p) return;
      const dt = 60 / p.bpm / 2;
      while (this.next < this.ctx.currentTime + 0.25){
        const chord = p.chords[Math.floor(this.step / 8) % p.chords.length];
        p.play(this, this.step, this.next, chord); this.step++; this.next += dt;
      }
    }, 60);
  },
  stop(){ clearInterval(this.timer); this.mode = null; },
  sfx(name){
    this.init(); const c = this.ctx; if (!c) return; const t = c.currentTime + 0.02;
    if (name === "join") { this.tone(84, t, 0.18, "sine", 0.25); this.tone(91, t + 0.07, 0.25, "sine", 0.2); }
    if (name === "tick") this.tone(96, t, 0.08, "square", 0.08);
    if (name === "reveal") [72, 76, 79, 84, 88].forEach((m, i) => this.tone(m, t + i * 0.07, 0.9, "sine", 0.22));
    if (name === "fanfare"){
      [[67,0,.18],[72,.18,.18],[76,.36,.18],[79,.54,.5],[76,.95,.18],[79,1.13,1.4]].forEach(([m, d, l]) => { this.tone(m, t + d, l, "triangle", 0.3); this.tone(m - 12, t + d, l, "sine", 0.2); });
      [72, 76, 79, 84].forEach(m => this.tone(m, t + 1.13, 1.8, "sine", 0.12));
    }
  },
};

/* ---------------- transport ----------------
   Онлайн: PeerJS (WebRTC). Тест: BroadcastChannel (?local). */
function hostTransport(code, h){
  if (LOCAL){
    const ch = new BroadcastChannel("fq-" + code);
    ch.onmessage = e => { const d = e.data; if (d.to === "host") h.onMessage(d.from, d.msg); };
    setTimeout(h.onReady, 50);
    return { send: (id, msg) => ch.postMessage({ to: id, from: "host", msg }), close: () => ch.close() };
  }
  if (!window.Peer){ setTimeout(() => h.onError("Не загрузилась библиотека связи (PeerJS). Проверьте интернет."), 0); return { send(){}, close(){} }; }
  const conns = new Map();
  const peer = new Peer(PEER_PREFIX + code, { config: ICE });
  peer.on("open", () => h.onReady());
  peer.on("error", e => h.onError(e.type === "unavailable-id" ? "id-taken" : (e.type || String(e))));
  peer.on("disconnected", () => { if (!peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch(e){} }, 1500); });
  peer.on("connection", conn => {
    conn.on("open", () => conns.set(conn.peer, conn));
    conn.on("data", d => h.onMessage(conn.peer, d));
    conn.on("close", () => { conns.delete(conn.peer); h.onLeave(conn.peer); });
    conn.on("error", () => { conns.delete(conn.peer); h.onLeave(conn.peer); });
  });
  return {
    send(id, msg){ const c = conns.get(id); if (c && c.open) try { c.send(msg); } catch(e){} },
    close(){ try { peer.destroy(); } catch(e){} },
  };
}
function playerTransport(code, h){
  if (LOCAL){
    const me = "p-" + rnd(8);
    const ch = new BroadcastChannel("fq-" + code);
    ch.onmessage = e => { const d = e.data; if (d.to === me) h.onMessage(d.msg); };
    setTimeout(h.onOpen, 50);
    return { send: msg => ch.postMessage({ to: "host", from: me, msg }), close: () => ch.close() };
  }
  if (!window.Peer){ setTimeout(() => h.onError("Не загрузилась библиотека связи. Проверь интернет и обнови страницу."), 0); return { send(){}, close(){} }; }
  let conn = null, done = false;
  const peer = new Peer(undefined, { config: ICE });
  const fail = msg => { if (done) return; done = true; h.onError(msg); };
  peer.on("open", () => {
    conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    conn.on("open", () => h.onOpen());
    conn.on("data", d => h.onMessage(d));
    conn.on("close", () => fail("closed"));
    conn.on("error", () => fail("closed"));
  });
  peer.on("error", e => fail(e.type === "peer-unavailable" ? "no-room" : "closed"));
  return {
    send(msg){ if (conn && conn.open) try { conn.send(msg); } catch(e){} },
    close(){ done = true; try { peer.destroy(); } catch(e){} },
  };
}

   ВЕДУЩИЙ
   ============================================================ */
const H = {
  code: null, tr: null, phase: "lobby", qi: -1, qStart: 0, timer: null,
  players: {},          // token -> {name, score, connId, answers:{qi:{choice, ms, pts, correct}}}
  conn2tok: {},
  revealTimer: null,
};
function hostSave(){
  store.set("fq-host", { code: H.code, phase: H.phase, qi: H.qi, players: Object.fromEntries(Object.entries(H.players).map(([k, p]) => [k, { ...p, connId: null }])) });
}
function hostStart(resume){
  Music.init();
  if (!document.getElementById("snd")){ const b = document.createElement("button"); b.id = "snd"; b.className = "snd"; b.title = "Звук"; b.textContent = Music.on ? "🔊" : "🔇"; b.onclick = () => Music.toggle(); document.body.appendChild(b); }
  if (resume){ Object.assign(H, { code: resume.code, phase: resume.phase === "question" ? "reveal" : resume.phase, qi: resume.qi, players: resume.players || {} }); }
  else { H.code = String(Math.floor(1000 + Math.random() * 9000)); H.phase = "lobby"; H.qi = -1; H.players = {}; }
  H.conn2tok = {};
  app.innerHTML = `<div class="center card" style="max-width:520px;margin:12vh auto"><h2>Открываем комнату ${esc(H.code)}…</h2><p class="muted" id="hs">Подключаемся к сети</p></div>`;
  connectHost(0);
}
function connectHost(attempt){
  if (H.tr) H.tr.close();
  H.tr = hostTransport(H.code, {
    onReady(){ hostSave(); hostRender(); broadcast(); if (H.phase === "lobby" || H.phase === "final" || H.phase === "reveal") Music.play("lobby"); },
    onError(err){
      if (err === "id-taken"){
        if (attempt < 8){ const el = document.getElementById("hs"); if (el) el.textContent = "Комната ещё занята, повторяем…"; setTimeout(() => connectHost(attempt + 1), 4000); }
        else { H.code = String(Math.floor(1000 + Math.random() * 9000)); connectHost(0); }
        return;
      }
      if (H.phase !== "lobby" || Object.keys(H.players).length) { setTimeout(() => connectHost(attempt + 1), 3000); return; }
      app.innerHTML = `<div class="center card" style="max-width:560px;margin:12vh auto"><h2>Не получилось открыть комнату</h2><p class="err">${esc(err)}</p><button class="btn" onclick="location.reload()">Попробовать ещё раз</button></div>`;
    },
    onMessage: hostOnMessage,
    onLeave(id){ const t = H.conn2tok[id]; if (t && H.players[t] && H.players[t].connId === id){ H.players[t].connId = null; hostRender(); } delete H.conn2tok[id]; },
  });
}
function hostOnMessage(from, m){
  if (!m || typeof m !== "object") return;
  if (m.t === "join"){
    const name = String(m.name || "").trim().slice(0, 24), token = String(m.token || "").slice(0, 40);
    if (!name || !token) return;
    const existing = H.players[token];
    const clash = Object.entries(H.players).find(([t, p]) => t !== token && p.name.toLowerCase() === name.toLowerCase());
    if (clash){ H.tr.send(from, { t: "error", msg: "Такое имя уже занято 🙈 Добавь первую букву фамилии или смайлик." }); return; }
    if (!existing && H.phase !== "lobby" && H.phase !== "question" && H.phase !== "reveal"){ H.tr.send(from, { t: "error", msg: "Игра уже закончилась." }); return; }
    if (existing){ existing.name = name; existing.connId = from; }
    else { H.players[token] = { name, score: 0, connId: from, answers: {} }; if (H.phase === "lobby") Music.sfx("join"); }
    H.conn2tok[from] = token;
    hostSave(); sendState(token); hostRender();
    return;
  }
  if (m.t === "answer"){
    const token = H.conn2tok[from]; const p = token && H.players[token];
    if (!p || H.phase !== "question" || m.qi !== H.qi || p.answers[H.qi]) return;
    const choice = Number(m.choice); if (!(choice >= 0 && choice < 4)) return;
    const ms = Date.now() - H.qStart;
    const correct = choice === QUESTIONS[H.qi].correct;
    const pts = correct ? Math.max(500, Math.round(1000 - 500 * ms / (QUESTION_SECONDS * 1000))) : 0;
    p.answers[H.qi] = { choice, ms, pts, correct };
    p.score += pts;
    hostSave(); sendState(token); hostRenderCounts();
    const online = Object.values(H.players).filter(x => x.connId);
    if (online.length && online.every(x => x.answers[H.qi])) { clearTimeout(H.revealTimer); H.revealTimer = setTimeout(hostReveal, 700); }
  }
}
function ranking(){
  return Object.entries(H.players)
    .map(([token, p]) => ({ token, ...p, totalMs: Object.values(p.answers).reduce((s, a) => s + (a.correct ? a.ms : 0), 0) }))
    .sort((a, b) => b.score - a.score || a.totalMs - b.totalMs || a.name.localeCompare(b.name, "ru"));
}
function stateFor(token){
  const p = H.players[token]; const total = QUESTIONS.length;
  const s = { t: "state", phase: H.phase, qi: H.qi, total, name: p.name, score: p.score };
  if (H.phase === "question" || H.phase === "reveal"){
    const Q = QUESTIONS[H.qi];
    s.q = Q.q; s.a = Q.a; s.img = Q.img || ""; s.image = Q.image || "";
    const ans = p.answers[H.qi];
    s.my = ans ? ans.choice : null;
    if (H.phase === "question") s.remaining = Math.max(0, QUESTION_SECONDS * 1000 - (Date.now() - H.qStart));
    if (H.phase === "reveal"){ s.correct = Q.correct; s.gained = ans ? ans.pts : 0; s.ok = !!(ans && ans.correct); }
  }
  if (H.phase === "reveal" || H.phase === "final"){
    const r = ranking(); const rank = r.findIndex(x => x.token === token) + 1;
    s.rank = rank; s.players = r.length;
    if (H.phase === "final") s.title = titleFor(rank);
  }
  return s;
}
function sendState(token){ const p = H.players[token]; if (p && p.connId) H.tr.send(p.connId, stateFor(token)); }
function broadcast(){ Object.keys(H.players).forEach(sendState); }

function hostNext(){
  clearTimeout(H.revealTimer);
  if (H.qi + 1 >= QUESTIONS.length){ H.phase = "final"; hostSave(); broadcast(); hostRender(); confetti(140); Music.stop(); Music.sfx("fanfare"); setTimeout(() => { if (H.phase === "final") Music.play("lobby"); }, 3500); return; }
  H.qi++; H.phase = "question"; H.qStart = Date.now();
  hostSave(); broadcast(); hostRender();
  Music.play("question"); H.lastSec = null;
  clearInterval(H.timer);
  H.timer = setInterval(() => {
    const left = QUESTION_SECONDS * 1000 - (Date.now() - H.qStart);
    const t = document.getElementById("timer");
    if (t){ t.style.setProperty("--p", Math.max(0, left / (QUESTION_SECONDS * 10)) + "%"); t.querySelector("span").textContent = Math.max(0, Math.ceil(left / 1000)); }
    const sec = Math.ceil(left / 1000);
    if (sec <= 5 && sec > 0 && sec !== H.lastSec){ H.lastSec = sec; Music.sfx("tick"); }
    if (left <= 0) hostReveal();
  }, 200);
}
function hostReveal(){
  if (H.phase !== "question") return;
  clearInterval(H.timer); clearTimeout(H.revealTimer);
  H.phase = "reveal"; hostSave(); broadcast(); hostRender();
  Music.stop(); Music.sfx("reveal"); setTimeout(() => { if (H.phase === "reveal") Music.play("lobby"); }, 1600);
}
function hostRestart(){
  if (!confirm("Начать игру заново? Баллы обнулятся, участницы останутся в комнате.")) return;
  Object.values(H.players).forEach(p => { p.score = 0; p.answers = {}; });
  H.phase = "lobby"; H.qi = -1; hostSave(); broadcast(); hostRender(); Music.play("lobby");
}
function hostNewRoom(){
  if (!confirm("Закрыть эту комнату и создать новую?")) return;
  store.del("fq-host"); location.href = location.pathname + (LOCAL ? "?local=1" : "");
}
function hostRenderCounts(){
  const el = document.getElementById("answered"); if (!el) return;
  const all = Object.values(H.players); const online = all.filter(p => p.connId);
  el.textContent = `Ответили: ${all.filter(p => p.answers[H.qi]).length} из ${online.length}`;
}
function lbRows(list, from = 1, withTitles = false){
  return list.map((p, i) => `<div class="lb-row"><div class="pl">${from + i}</div><div><div class="nm">${esc(p.name)}</div>${withTitles ? `<div class="tt">${esc(titleFor(from + i))}</div>` : ""}</div><div class="sc">${p.score}</div></div>`).join("");
}
function hostRender(){
  const players = Object.values(H.players);
  const online = players.filter(p => p.connId).length;
  if (H.phase === "lobby"){
    const url = joinUrl(H.code);
    app.innerHTML = `
      <div class="center"><h1 class="big-title">✨ Волшебный мир анимации ✨</h1><p class="sub">Интеллектуальная викторина</p></div>
      <div class="lobby">
        <div class="card center">
          <div class="muted" style="font-weight:900">Код комнаты</div>
          <div class="code">${esc(H.code)}</div>
          <div class="qr" id="qr"></div>
          <div class="url">${esc(url)}</div>
          <p class="muted small">Отсканируйте QR-код или откройте ссылку и введите код</p>
        </div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Участницы</h2><span class="pill">${players.length}</span></div>
          <div class="chips">${players.length ? players.map(p => `<span class="chip ${p.connId ? "" : "off"}">${esc(p.name)}</span>`).join("") : `<p class="muted">Пока никого… Ждём фей 🧚</p>`}</div>
          <div class="controls"><button class="btn" ${players.length ? "" : "disabled"} onclick="hostNext()">Начать квиз 🚀</button></div>
          <p class="muted small" style="text-align:center">${QUESTIONS.length} вопросов · ${QUESTION_SECONDS} секунд на ответ</p>
        </div>
      </div>
      <div class="controls"><button class="btn ghost small" onclick="hostNewRoom()">Новая комната</button></div>`;
    if (window.QRCode) new QRCode(document.getElementById("qr"), { text: url, width: 220, height: 220, colorDark: "#3a0a4a", colorLight: "#ffffff" });
    else document.getElementById("qr").outerHTML = "";
    return;
  }
  if (H.phase === "question" || H.phase === "reveal"){
    const Q = QUESTIONS[H.qi]; const rev = H.phase === "reveal";
    const counts = [0, 0, 0, 0]; players.forEach(p => { const a = p.answers[H.qi]; if (a) counts[a.choice]++; });
    const left = Math.max(0, QUESTION_SECONDS * 1000 - (Date.now() - H.qStart));
    const last = H.qi + 1 >= QUESTIONS.length;
    const r = ranking();
    app.innerHTML = `
      <div class="qhead">
        <span class="pill">Вопрос ${H.qi + 1} из ${QUESTIONS.length}</span>
        ${rev ? `<span class="pill">✅ Правильный ответ</span>` : `<div class="timer" id="timer" style="--p:${left / (QUESTION_SECONDS * 10)}%"><span>${Math.ceil(left / 1000)}</span></div>`}
        <span class="pill" id="answered"></span>
      </div>
      ${Q.image ? `<img class="qpic" src="${esc(Q.image)}" alt="">` : Q.img ? `<div class="qimg">${esc(Q.img)}</div>` : ""}
      <div class="qtext">${esc(Q.q)}</div>
      <div class="opts">${Q.a.map((t, i) => `<div class="opt o${i} ${rev ? (i === Q.correct ? "right" : "dim") : ""}"><span class="sh">${SHAPES[i]}</span><span>${esc(t)}</span>${rev ? `<span class="cnt">${counts[i]}</span>` : ""}</div>`).join("")}</div>
      <div class="controls">
        ${rev ? `<button class="btn" onclick="hostNext()">${last ? "Итоги и звания 🏆" : "Следующий вопрос →"}</button>` : `<button class="btn ghost" onclick="hostReveal()">Показать ответ</button>`}
      </div>
      ${rev ? `<div class="top5 card" style="max-width:720px;margin:22px auto 0"><h3 style="margin:0 0 6px">Топ-5 сейчас</h3>${lbRows(r.slice(0, 5))}</div>` : ""}
      <p class="center muted small">Онлайн: ${online} из ${players.length}</p>`;
    hostRenderCounts();
    return;
  }
  if (H.phase === "final"){
    const r = ranking(); const top = r.slice(0, 3);
    const pod = (p, place, cls) => p ? `<div class="pod ${cls}"><div class="nm">${esc(p.name)}</div><div class="tt">${esc(titleFor(place))}</div><div class="sc">${p.score} баллов</div><div class="blk">${place}</div></div>` : "";
    const rest = r.slice(3); const half = Math.ceil(rest.length / 2);
    app.innerHTML = `
      <div class="center"><h1 class="big-title">🏆 Доска легенд Магикса 🏆</h1><p class="sub">Звания присваиваются торжественно и навсегда</p></div>
      <div class="podium">${pod(top[1], 2, "p2")}${pod(top[0], 1, "p1")}${pod(top[2], 3, "p3")}</div>
      ${rest.length ? `<div class="card"><div class="lb-grid"><div>${lbRows(rest.slice(0, half), 4, true)}</div><div>${lbRows(rest.slice(half), 4 + half, true)}</div></div></div>` : ""}
      <div class="controls"><button class="btn" onclick="hostRestart()">Сыграть ещё раз</button><button class="btn ghost" onclick="hostNewRoom()">Новая комната</button></div>`;
  }
}

const P = { tr: null, code: null, name: null, token: null, s: null, qShownAt: 0, remainingAtShow: 0, tick: null, retry: 0, lastQi: -1 };

  const go = () => {
    const code = document.getElementById("jcode").value.replace(/\D/g, "").slice(0, 4);
    const name = document.getElementById("jname").value.trim().replace(/\s+/g, " ").slice(0, 20);
    if (code.length !== 4) return playerJoinScreen(code, "Код комнаты — 4 цифры с экрана ведущего.");
    if (name.length < 2) return playerJoinScreen(code, "Напиши имя хотя бы из двух букв.");
    const token = (saved.code === code && saved.token) ? saved.token : rnd(12);
    store.set("fq-player", { code, name, token });
    P.code = code; P.name = name; P.token = token; P.retry = 0;
    playerConnect();
  };
  document.getElementById("jgo").onclick = go;
  document.getElementById("jname").onkeydown = e => { if (e.key === "Enter") go(); };
}
function playerConnect(){
  if (P.tr) P.tr.close();
  if (!P.s) app.innerHTML = `<div class="center card" style="max-width:440px;margin:15vh auto"><h2>Подключаемся… 🔮</h2><p class="muted">Комната ${esc(P.code)}</p></div>`;
  P.tr = playerTransport(P.code, {
    onOpen(){ P.retry = 0; P.tr.send({ t: "join", name: P.name, token: P.token }); },
    onMessage(m){
      if (!m || typeof m !== "object") return;
      if (m.t === "error"){ P.tr.close(); P.s = null; playerJoinScreen(P.code, m.msg); return; }
      if (m.t === "state"){ P.s = m; if (m.phase === "question" && m.qi !== P.lastQi){ P.lastQi = m.qi; } if (m.phase === "question"){ P.qShownAt = Date.now(); P.remainingAtShow = m.remaining; } playerRender(); }
    },
    onError(err){
      if (err === "no-room" && !P.s){ playerJoinScreen(P.code, "Комната не найдена. Проверь код — или ведущий ещё не открыл её."); return; }
      P.retry++;
      const st = document.getElementById("pstatus"); if (st) st.textContent = "Связь прервалась, переподключаемся…";
      setTimeout(playerConnect, Math.min(1000 * P.retry, 5000));
    },
  });
}
function playerAnswer(i){
  if (!P.s || P.s.phase !== "question" || P.s.my != null) return;
  P.s.my = i; P.tr.send({ t: "answer", qi: P.s.qi, choice: i }); playerRender();
}
function playerRender(){
  clearInterval(P.tick);
  const s = P.s; if (!s) return;
  const top = `<div class="ptop"><span>🧚 ${esc(s.name)}</span><span class="badge">${s.score} баллов</span></div><div id="pstatus" class="muted small center"></div>`;
  if (s.phase === "lobby"){
    app.innerHTML = `<div style="max-width:480px;margin:0 auto">${top}<div class="center card" style="margin-top:12vh"><div class="res">🦋</div><h2>Ты в игре!</h2><p class="muted">Смотри на большой экран — скоро начнём ✨</p></div></div>`;
    return;
  }
  if (s.phase === "question"){
    if (s.my != null){
      app.innerHTML = `<div style="max-width:480px;margin:0 auto">${top}<div class="center card" style="margin-top:10vh"><div class="res">💌</div><h2>Ответ принят!</h2><p class="muted">Ты выбрала: <b>${SHAPES[s.my]} ${esc(s.a[s.my])}</b></p><p class="muted">Ждём остальных фей…</p></div></div>`;
      return;
    }
    app.innerHTML = `<div style="max-width:520px;margin:0 auto">${top}
      <div class="muted center small">Вопрос ${s.qi + 1} из ${s.total}</div>
      <div class="bar"><div id="pbar" style="width:100%"></div></div>
      ${s.image ? `<img class="ppic" src="${esc(s.image)}" alt="">` : s.img ? `<div class="pimg">${esc(s.img)}</div>` : ""}
      <div class="pq">${esc(s.q)}</div>
      <div class="popts">${s.a.map((t, i) => `<button class="opt o${i}" onclick="playerAnswer(${i})"><span class="sh">${SHAPES[i]}</span><span>${esc(t)}</span></button>`).join("")}</div></div>`;
    const upd = () => {
      const left = P.remainingAtShow - (Date.now() - P.qShownAt);
      const b = document.getElementById("pbar"); if (b) b.style.width = Math.max(0, left / (QUESTION_SECONDS * 10)) + "%";
      if (left <= 0){ clearInterval(P.tick); app.querySelectorAll(".popts .opt").forEach(x => { x.disabled = true; x.classList.add("dim"); }); }
    };
    upd(); P.tick = setInterval(upd, 200);
    return;
  }
  if (s.phase === "reveal"){
    const ok = s.ok, none = s.my == null;
    app.innerHTML = `<div style="max-width:480px;margin:0 auto">${top}<div class="center card" style="margin-top:8vh">
      <div class="res">${ok ? "🌟" : none ? "⏰" : "💔"}</div>
      <h2 style="color:${ok ? "var(--good)" : "var(--bad)"}">${ok ? "Верно!" : none ? "Время вышло" : "Не угадала"}</h2>
      ${ok ? `<p style="font-size:26px;font-weight:900;color:var(--gold)">+${s.gained}</p>` : `<p class="muted">Правильно: <b>${SHAPES[s.correct]} ${esc(s.a[s.correct])}</b></p>`}
      <p class="muted">Ты на <b>${s.rank}</b> месте из ${s.players}</p></div></div>`;
    if (ok) confetti(25);
    return;
  }
  if (s.phase === "final"){
    app.innerHTML = `<div style="max-width:480px;margin:0 auto">${top}<div class="center card" style="margin-top:6vh">
      <div class="res">${s.rank === 1 ? "👑" : s.rank <= 3 ? "🏆" : "✨"}</div>
      <p class="muted" style="margin:0">Твоё место</p>
      <div class="code" style="font-size:80px">${s.rank}</div>
      <p class="muted" style="margin:6px 0">из ${s.players} · ${s.score} баллов</p>
      <p class="muted" style="margin:18px 0 4px">Твоё звание</p>
      <h2 style="margin:0;font-size:28px">${esc(s.title)}</h2></div></div>`;
    confetti(s.rank <= 3 ? 100 : 50);
  }
}

/* ============================================================
   СТАРТ
   ============================================================ */
function landing(){
  const saved = store.get("fq-host");
  app.innerHTML = `
    <div class="center" style="max-width:560px;margin:8vh auto 0">
      <h1 class="big-title">✨ Волшебный мир анимации ✨</h1>
      <p class="sub">Интеллектуальная викторина</p>
      <div class="card" style="width:100%">
        <div class="row" style="flex-direction:column;gap:12px">
          <button class="btn" onclick="playerJoinScreen()">Я участница 🧚</button>
          <button class="btn ghost" onclick="hostStart()">Я ведущий — создать комнату</button>
          ${saved && saved.phase !== "final" ? `<button class="btn ghost" onclick="hostStart(store.get('fq-host'))">Вернуться в комнату ${esc(saved.code)}</button>` : ""}
        </div>
        ${LOCAL ? `<p class="muted small" style="margin-top:16px">Тестовый режим: открывайте участниц в других вкладках этого браузера.</p>` : ""}
      </div>
    </div>`;
}
if (params.get("room")){
  const room = params.get("room").replace(/\D/g, "").slice(0, 4), sv = store.get("fq-player");
  if (sv && sv.code === room && sv.name && sv.token){ P.code = room; P.name = sv.name; P.token = sv.token; playerConnect(); }
  else playerJoinScreen(room);
}
else landing();
</script>
